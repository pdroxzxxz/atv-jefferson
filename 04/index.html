<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

<h1>Desafio raiz</h1>


<div class="bloco-raiz">
  <h2>Raiz Quadrada de N</h2>
  
  <label for="numeroN">Digite o valor de N: </label>
  <input type="number" id="numeroN" placeholder="Digite um número">
  <button onclick="calcularRaiz()">Raiz de N</button>

  <p id="resultado"></p>
</div>

<script>
function calcularRaiz() {
 
  const valorInput = document.getElementById('numeroN').value;
  const n = parseInt(valorInput, 10);

  if (isNaN(n) || n <= 0) {
    alert("Por favor, digite um número inteiro válido e maior que zero!");
  } else {

    const raiz = Math.sqrt(n);
    document.getElementById('resultado').textContent = `A raiz quadrada de ${n} é: ${raiz}`;
  }
}
</script>

   




<br><br>






</body>
</html>
