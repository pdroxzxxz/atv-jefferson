<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
 <hr>   
<h1>Desafio com Input</h1>

<label for="numero Input">Digite o valor de N:</label>

<input type="number" id="numeroInput" placeholder="Digite um número" min="1">

<button onclick="escreverNumerosInput()">Escrever Números</button>

<br><br>

<div id="numerosInput"></div>

<div>
<script>
function escreverNumerosInput() {
   var input = document.getElementById("numero Input");
   var n = parseInt(input.value);
   if (isNaN(n) || n <= 0) {alert("Por favor, insira um número válido maior que zero.");

return;
}

var div = document.getElementById("numerosInput");
div.innerHTML = "";
for (var i = 1; i <= n; i++) {
     div.innerHTML += i + "<br>";

}

}
</script>

</div>












</body>
</html>
