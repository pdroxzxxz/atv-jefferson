<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Atividade 03 - Tabelas</title>
</head>

<body>

<h1> Tabelas </h1>

<table border="1">
    <tr>
        <td><img src="https://4kwallpapers.com/images/wallpapers/ben-10-5k-cartoon-4480x2520-18954.jpg" width="100px"></td>
        <td>Coluna 2</td>
    </tr>
    <tr>
        <td>Linha 2</td>
        <td>Outra informação</td>
    </tr>
</table>

<hr>

<h1>Listagem de Produtos</h1>

<table border="1" width="50%" cellpadding="10" cellspacing="5" bgcolor="lightgray">

    <!-- Cabeçalho -->
    <tr>
        <th>Produto</th>
        <th>Preço</th>
        <th>Quantidade</th>
    </tr>

    <!-- Produtos -->
    <tr>
        <td>Mouse</td>
        <td>50</td>
        <td>2</td>
    </tr>

    <tr>
        <td>Teclado</td>
        <td>100</td>
        <td>1</td>
    </tr>

    <tr>
        <td>Monitor</td>
        <td>800</td>
        <td>1</td>
    </tr>

    <!-- Total -->
    <tr>
        <td colspan="2">Total</td>
        <td>950</td>
    </tr>

    <!-- Encargos -->
    <tr>
        <td rowspan="2">Encargos</td>
        <td>Juros</td>
        <td>50</td>
    </tr>

    <tr>
        <td>Multa</td>
        <td>20</td>
    </tr>

    <!-- Total Geral -->
    <tr>
        <td colspan="2">Total Geral</td>
        <td>1020</td>
    </tr>

</table>

<hr>
