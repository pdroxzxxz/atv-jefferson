```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Contatos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h2 class="mb-4">Cadastro de Contatos</h2>

        <!-- FORMULÁRIO -->
        <div class="card p-3 shadow-sm">

            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" id="nome" class="form-control"
                    placeholder="Digite o nome">
            </div>

            <div class="mb-3">
                <label for="contato" class="form-label">Contato</label>
                <input type="text" id="contato" class="form-control"
                    placeholder="Digite o contato">
            </div>

            <div class="d-flex gap-2">

                <button class="btn btn-secondary" onclick="salvar()">
                    Salvar
                </button>

            </div>

        </div>

        <hr>

        <!-- BOTÕES -->
        <button class="btn btn-secondary" onclick="posicao()">
            Posição
        </button>

        <button class="btn btn-danger" onclick="remover()">
            Remover Último
        </button>

        <button class="btn btn-danger" onclick="limparLista()">
            Limpar Lista
        </button>

        <button class="btn btn-secondary" onclick="inverterPilha()">
            Inverter
        </button>

        <br><br>

        <!-- TABELA -->
        <div id="minhaDiv">

            <table class="table table-bordered table-striped align-middle shadow-sm">

                <thead class="table-dark">

                    <tr>
                        <th>#</th>
                        <th>Nome</th>
                        <th>Contato</th>
                        <th>Ações</th>
                    </tr>

                </thead>

                <tbody id="tabelaCorpo">
                    <!-- Linhas serão inseridas aqui -->
                </tbody>

            </table>

        </div>

        <hr>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        // Lista de contatos
        let lista = [];

        // Controla se estamos editando algum contato
        let indiceEdicao = -1;


        // =========================
        // SALVAR
        // =========================
        function salvar() {

            let nome = document.getElementById("nome").value;
            let contato = document.getElementById("contato").value;

            // Verifica campos vazios
            if (nome === "" || contato === "") {

                alert("Preencha todos os campos!");

                return;
            }


            // Se não estiver editando
            if (indiceEdicao === -1) {

                lista.push({
                    nome: nome,
                    contato: contato
                });

            }

            // Se estiver editando
            else {

                lista[indiceEdicao].nome = nome;
                lista[indiceEdicao].contato = contato;

                indiceEdicao = -1;
            }


            // Limpa os campos
            document.getElementById("nome").value = "";
            document.getElementById("contato").value = "";


            // Atualiza a tabela
            mostrarLista();
        }


        // =========================
        // MOSTRAR LISTA
        // =========================
        function mostrarLista() {

            let tabela = document.getElementById("tabelaCorpo");

            tabela.innerHTML = "";


            for (let i = 0; i < lista.length; i++) {

                tabela.innerHTML += `

                    <tr>

                        <td>${i + 1}</td>

                        <td>${lista[i].nome}</td>

                        <td>${lista[i].contato}</td>

                        <td>

                            <button
                                class="btn btn-primary btn-sm"
                                onclick="editarContato(${i})">

                                Editar

                            </button>


                            <button
                                class="btn btn-danger btn-sm"
                                onclick="removerContato(${i})">

                                Remover

                            </button>

                        </td>

                    </tr>

                `;
            }
        }


        // =========================
        // EDITAR
        // =========================
        function editarContato(indice) {

            document.getElementById("nome").value =
                lista[indice].nome;

            document.getElementById("contato").value =
                lista[indice].contato;


            indiceEdicao = indice;
        }


        // =========================
        // REMOVER UM CONTATO
        // =========================
        function removerContato(indice) {

            lista.splice(indice, 1);

            mostrarLista();
        }


        // =========================
        // REMOVER ÚLTIMO
        // =========================
        function remover() {

            if (lista.length === 0) {

                alert("A lista está vazia!");

                return;
            }

            lista.pop();

            mostrarLista();
        }


        // =========================
        // LIMPAR LISTA
        // =========================
        function limparLista() {

            lista = [];

            mostrarLista();
        }


        // =========================
        // INVERTER
        // =========================
        function inverterPilha() {

            lista.reverse();

            mostrarLista();
        }


        // =========================
        // POSIÇÃO
        // =========================
        function posicao() {

            if (lista.length === 0) {

                alert("A lista está vazia!");

                return;
            }

            alert(
                "Última posição: " +
                (lista.length - 1)
            );
        }

    </script>

</body>

</html>
