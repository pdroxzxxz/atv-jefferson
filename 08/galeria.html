    font-family: Arial, sans-serif;

    background:#006400;
    color:white;
    text-align:center;
    padding:20px;
}

nav{
    background:#222;
    padding:10px;
    text-align:center;

    color:white;
    text-decoration:none;
    margin:15px;
    padding:8px 15px;
}

    background:green;

}

.galeria{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    margin:20px;
}

.card{
    width:250px;
    background:white;
    border:1px solid #ccc;
    padding:10px;
    box-sizing:border-box;
}

.card header{
    background:#ddd;
    color:black;
    padding:5px;
    margin-bottom:10px;
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
}

footer{
    background:#006400;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}
