<!DOCTYPE html>
<html>
<head>
    <title>Exercícios JavaScript</title>
</head>
<body>



<div>
 <h1>Raiz Quadrada</h1>

    <button onclick="calcularRaiz(25)">Raiz de 25</button><br><br>
    <button onclick="calcularRaiz(36)">Raiz de 36</button><br><br>
    <button onclick="calcularRaiz(49)">Raiz de 49</button>

    <script>
        function calcularRaiz(numero) {
            let raiz = Math.sqrt(numero);
            alert("A raiz quadrada de " + numero + " é " + raiz);
        }
    </script>


<div>
        <h1>Escrevendo na Div</h1>

        <button onclick="escreveDiv('<h1>Programação Web</h1>')">Escrever</button>
        

        <div id="minhaDiv"></div>
    </div>

    <script>
        function escreveDiv(text) {
            document.getElementById('minhaDiv').innerHTML = text;
        }
    </script>













    <h2>desafio</h2>

    <button onclick="numerar()">escreva numeros</button>

    <div id="numeros"></div>

    <script>

        function calcularRaizes() {

            let raiz25 = Math.sqrt(25);

            let raiz36 = Math.sqrt(36);

            let raiz49 = Math.sqrt(49);

            document.getElementById("raizes").innerHTML =
            "Raiz de 25 = " + raiz25 + "<br>" +
            "Raiz de 36 = " + raiz36 + "<br>" +
            "Raiz de 49 = " + raiz49;

        }

        calcularRaizes();


        function escreveDiv() {

            document.getElementById("resultadoTexto").innerHTML =
            "Olá! Este texto foi escrito dentro da div.";

        }

        escreveDiv();


        function mostrarTexto() {

            let texto = document.getElementById("texto").value;

            document.getElementById("resultadoDinamico").innerHTML = texto;

        }


        function numerar() {

            let n = parseInt(prompt("Digite um número:"));

            let texto = "";

            for (let i = 1; i <= n; i++) {

                texto += i + "<br>";

            }

            document.getElementById("numeros").innerHTML = texto;

        }

    </script>

</body>
</html>
