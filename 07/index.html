<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Atividade 07 - Fontes e cores</title>

    <style>
        .serif {
            font-family: "Times New Roman", Georgia, serif;
            font-style: normal;
        }

        .sans {
            font-family: Arial, Helvetica, sans-serif;
            font-style: italic;
        }

        .mono {
            font-family: "Courier New", Consolas, monospace;
            font-style: oblique;
        }

        .cursive {
            font-family: "Brush Script MT", cursive;
            font-style: italic;
        }

        .fantasy {
            font-family: Impact, fantasy;
            font-style: normal;
        }
    </style>
</head>
<body>

    <h1>Famílias de Fontes</h1>

    <p class="serif">Progamação Web. </p>

    <p class="sans">programação web.</p>

    <p class="mono">programação web. </p>


</body>
</html>
