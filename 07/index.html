<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Atividade 07 - Famílias de Fontes</title>

    <style>
        .serif {
            font-family: "Times New Roman", Georgia, serif;
            font-style: normal;
        }

        .sans {
            font-family: Arial, Helvetica, sans-serif;
            font-style: italic;
        }

        .mono {
            font-family: "Courier New", Consolas, monospace;
            font-style: oblique;
        }

        .cursive {
            font-family: "Brush Script MT", cursive;
            font-style: italic;
        }

        .fantasy {
            font-family: Impact, fantasy;
            font-style: normal;
        }
    </style>
</head>
<body>

    <h1>Famílias de Fontes</h1>

    <p class="serif">
        Exemplo de fonte Serif.
    </p>

    <p class="sans">
        Exemplo de fonte Sans-Serif.
    </p>

    <p class="mono">
        Exemplo de fonte Monospace.
    </p>

    <p class="cursive">
        Exemplo de fonte Cursive.
    </p>

    <p class="fantasy">
        Exemplo de fonte Fantasy.
    </p>

</body>
</html>
