<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>java script</title>

<script>
    alert('test JS')
</script>




</head>
<body>
    
<script>
function minhaFuncao() {
       alert("Teste JS");
}

function minhaFuncaoArg(arg) {
        alert(arg);
}

function minhaFuncaoNumerica(arg1, arg2) {
       alert(arg1 + arg2);
}

function minhaFuncaoSoma(arg1, arg2) {
      var soma = arg1 + arg2;
      var msg = "A soma é igual a ";
      alert(msg + soma);
}

function escreve(arg) {
     document.write(arg);
}
</script>
</head>

<body>

<h1>Atividade 01 - JavaScript</h1>
<div>
<button onclick="minhaFuncao()">Clique</button>
</div>

<div>
<button onclick="minhaFuncaoArg('Argumento 01')">Argumento 01</button>
</div>

<div>
<button onclick="minhaFuncaoArg(1500)">1500</button>
</div>

<div>
<button onclick="minhaFuncaoArg(true)">true</button>
</div>

<div>
<button onclick="minhaFuncaoNumerica(10, 20)">Somar 10 + 20</button>
</div>

<button onclick="minhaFuncaoSoma(10, 20)">Mostrar soma</button>


<div>
<button onclick="escreve('<h1>PROGRAMAÇÃO WEB</h1>')">Escreve</button>
</div>
</body>
</html>

































</body>
</html>
