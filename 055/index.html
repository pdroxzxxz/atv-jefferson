<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade 05 - CSS</title>

    <style>
        h1 {
            text-align: center;
            color: blue;
        }

        h2 {
            color: green;
        }

        p {
            font-family: Arial, sans-serif;
            font-size: 16px;
            color: #333333;
            text-align: justify;
            line-height: 1.5;
            margin: 10px 0;
            padding: 5px 10px;
            text-indent: 20px;
            font-weight: bold;
            font-style: italic;
            background-color: #f4f4f4;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <h1 style="color: red; border: 1px solid blue;">
        Introdução ao CSS
    </h1>

    <h2>Formatação de páginas Web</h2>

    <p>
        CSS é uma linguagem utilizada para definir a aparência de páginas web.
    </p>

    <p>
        Com CSS podemos alterar cores, fontes, margens, bordas e diversos outros elementos visuais.
    </p>

    <p>
        O uso de folhas de estilo facilita a manutenção e organização do código.
    </p>

</body>
</html>
